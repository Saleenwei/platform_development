<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>游戏名称生成器 · Game Name Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
      color: #fff;
      padding: 28px 24px 20px;
      text-align: center;
    }
    header h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: 0.02em; }
    header p  { margin-top: 6px; font-size: 0.9rem; opacity: 0.75; }

    .container { max-width: 860px; margin: 0 auto; padding: 24px 16px 60px; }

    /* ── Card ── */
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      padding: 24px 28px;
      margin-bottom: 20px;
    }
    .card h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #0f3460;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card h2 .icon { font-size: 1.15rem; }

    /* ── Form Grid ── */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }

    label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #444;
      letter-spacing: 0.01em;
    }
    label span.required { color: #e53e3e; margin-left: 2px; }
    label span.hint {
      font-weight: 400;
      color: #888;
      font-size: 0.78rem;
      margin-left: 4px;
    }

    input[type="text"], input[type="password"], select, textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.88rem;
      color: #1a1a2e;
      background: #fafafa;
      transition: border-color .2s, box-shadow .2s;
      outline: none;
    }
    input[type="text"]:focus, input[type="password"]:focus,
    select:focus, textarea:focus {
      border-color: #0f3460;
      box-shadow: 0 0 0 3px rgba(15,52,96,.12);
      background: #fff;
    }
    textarea { resize: vertical; min-height: 72px; }

    /* ── Provider Row ── */
    .provider-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 600px) { .provider-row { grid-template-columns: 1fr; } }

    .api-key-row { display: flex; align-items: center; gap: 8px; }
    .api-key-row input { flex: 1; }
    .toggle-key-btn {
      background: none;
      border: 1.5px solid #d1d5db;
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 0.82rem;
      color: #555;
      white-space: nowrap;
      transition: border-color .15s;
    }
    .toggle-key-btn:hover { border-color: #0f3460; color: #0f3460; }

    /* ── Notice / Tip box ── */
    .notice {
      background: #eff6ff;
      border-left: 4px solid #3b82f6;
      border-radius: 0 8px 8px 0;
      padding: 12px 14px;
      font-size: 0.82rem;
      color: #1e40af;
      line-height: 1.6;
    }
    .notice strong { font-weight: 700; }

    /* ── Generate Button ── */
    .btn-generate {
      display: block;
      width: 100%;
      padding: 13px;
      background: linear-gradient(90deg, #0f3460, #533483);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
    }
    .btn-generate:hover:not(:disabled) { opacity: .9; }
    .btn-generate:active:not(:disabled) { transform: scale(.98); }
    .btn-generate:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Spinner ── */
    .spinner {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #0f3460;
      font-size: 0.9rem;
      margin-top: 14px;
    }
    .spinner.visible { display: flex; }
    .spinner-ring {
      width: 22px; height: 22px;
      border: 3px solid #d1d5db;
      border-top-color: #0f3460;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Error ── */
    .error-box {
      display: none;
      background: #fff5f5;
      border: 1.5px solid #fc8181;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.85rem;
      color: #c53030;
      margin-top: 14px;
      line-height: 1.55;
    }
    .error-box.visible { display: block; }

    /* ── Results ── */
    #results-section { display: none; }
    #results-section.visible { display: block; }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }
    .btn-copy-all {
      background: #0f3460;
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 7px 14px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn-copy-all:hover { opacity: .85; }

    /* ── Name Card ── */
    .name-card {
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 12px;
      transition: box-shadow .15s;
    }
    .name-card:hover { box-shadow: 0 2px 10px rgba(0,0,0,.07); }

    .name-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .name-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0f3460;
      word-break: break-all;
    }
    .name-char-badge {
      flex-shrink: 0;
      background: #f3f4f6;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #374151;
    }
    .name-char-badge.over { background: #fee2e2; color: #b91c1c; }

    .name-desc {
      font-size: 0.83rem;
      color: #555;
      line-height: 1.6;
      margin-bottom: 12px;
    }

    /* ── Checklist ── */
    .checklist { display: flex; flex-wrap: wrap; gap: 6px; }
    .check-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      padding: 3px 9px;
      border-radius: 20px;
      font-weight: 500;
    }
    .check-item.pass  { background: #d1fae5; color: #065f46; }
    .check-item.fail  { background: #fee2e2; color: #b91c1c; }
    .check-item.warn  { background: #fef3c7; color: #92400e; }

    .verdict {
      margin-top: 12px;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      display: inline-block;
    }
    .verdict.ok     { background: #d1fae5; color: #065f46; }
    .verdict.review { background: #fef3c7; color: #92400e; }
    .verdict.reject { background: #fee2e2; color: #b91c1c; }

    /* ── Raw output toggle ── */
    .raw-toggle {
      margin-top: 8px;
      font-size: 0.78rem;
      color: #6b7280;
      cursor: pointer;
      text-decoration: underline;
    }
    #raw-output {
      display: none;
      margin-top: 10px;
      padding: 12px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 0.78rem;
      white-space: pre-wrap;
      color: #374151;
      max-height: 300px;
      overflow-y: auto;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      font-size: 0.78rem;
      color: #9ca3af;
      margin-top: 32px;
    }
  </style>
</head>
<body>

<header>
  <h1>🎮 游戏名称生成器</h1>
  <p>基于 AI 的 Google Play 合规游戏名称生成工具 · 支持 OpenAI &amp; DeepSeek</p>
</header>

<div class="container">

  <!-- ① AI Provider & Model -->
  <div class="card">
    <h2><span class="icon">🤖</span> AI 提供商与模型</h2>

    <div class="provider-row" style="margin-bottom:16px;">
      <div class="form-group">
        <label for="provider">AI 提供商<span class="required">*</span></label>
        <select id="provider">
          <option value="openai">OpenAI</option>
          <option value="deepseek">DeepSeek</option>
        </select>
      </div>
      <div class="form-group">
        <label for="model">模型<span class="required">*</span></label>
        <select id="model"></select>
      </div>
    </div>

    <div class="form-group" style="margin-bottom:16px;">
      <label for="api-key">API Key<span class="required">*</span>
        <span class="hint">（密钥仅在本页面使用，不会上传到任何服务器）</span>
      </label>
      <div class="api-key-row">
        <input type="password" id="api-key" placeholder="粘贴你的 API Key…" autocomplete="off" />
        <button class="toggle-key-btn" id="toggle-key-btn" type="button">显示</button>
      </div>
    </div>

    <!-- Usage guidance -->
    <div class="notice" id="provider-notice">
      <!-- filled by JS -->
    </div>
  </div>

  <!-- ② Game Inputs -->
  <div class="card">
    <h2><span class="icon">✏️</span> 游戏三要素</h2>
    <div class="form-grid">
      <div class="form-group">
        <label for="gameplay">品类词<span class="required">*</span>
          <span class="hint">例：Casino Slots / Puzzle / RPG / Tycoon</span>
        </label>
        <input type="text" id="gameplay" placeholder="Casino Slots" />
      </div>
      <div class="form-group">
        <label for="theme">题材词<span class="required">*</span>
          <span class="hint">例：中国风、古代战马、水墨画风格</span>
        </label>
        <input type="text" id="theme" placeholder="中国风、古代战马、水墨画风格" />
      </div>
      <div class="form-group full">
        <label for="style">风格 / 情感
          <span class="hint">例：神秘 Mystic、皇家 Royal、极简 Simple、刺激 Rapid</span>
        </label>
        <input type="text" id="style" placeholder="Mystic Royal" />
      </div>
    </div>
  </div>

  <!-- ③ Generate -->
  <div class="card">
    <h2><span class="icon">⚡</span> 生成游戏名称</h2>
    <button class="btn-generate" id="generate-btn" type="button">🚀 一键生成 10 个候选名称</button>
    <div class="spinner" id="spinner">
      <div class="spinner-ring"></div>
      <span id="spinner-text">正在调用 AI，请稍候…</span>
    </div>
    <div class="error-box" id="error-box"></div>
  </div>

  <!-- ④ Results -->
  <div id="results-section">
    <div class="card">
      <div class="results-header">
        <h2 style="margin-bottom:0;"><span class="icon">📋</span> 生成结果与合规 Checklist</h2>
        <button class="btn-copy-all" id="copy-all-btn" type="button">📋 复制全部名称</button>
      </div>
      <div id="names-container"></div>

      <span class="raw-toggle" id="raw-toggle">▶ 查看 AI 原始回复</span>
      <pre id="raw-output"></pre>
    </div>
  </div>

  <footer>
    本工具完全在浏览器中运行，API Key 不会被任何第三方收集。
  </footer>

</div><!-- /container -->

<script>
/* ═══════════════════════════════════════════════════════════
   Provider / Model configuration
   ═══════════════════════════════════════════════════════════ */
const PROVIDERS = {
  openai: {
    label: "OpenAI",
    endpoint: "https://api.openai.com/v1/chat/completions",
    authHeader: (key) => `Bearer ${key}`,
    models: [
      { value: "gpt-4o",            label: "GPT-4o (推荐)" },
      { value: "gpt-4o-mini",       label: "GPT-4o Mini (快速/低成本)" },
      { value: "gpt-4-turbo",       label: "GPT-4 Turbo" },
      { value: "gpt-3.5-turbo",     label: "GPT-3.5 Turbo (经济)" },
    ],
    notice: `<strong>OpenAI 使用指引：</strong><br>
      1. 前往 <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">platform.openai.com/api-keys</a> 创建 API Key（以 <code>sk-</code> 开头）。<br>
      2. 确保账户有余额（Billing &gt; Overview）。<br>
      3. 推荐模型：<strong>GPT-4o</strong>（效果最佳）或 <strong>GPT-4o Mini</strong>（更经济）。`,
  },
  deepseek: {
    label: "DeepSeek",
    endpoint: "https://api.deepseek.com/chat/completions",
    authHeader: (key) => `Bearer ${key}`,
    models: [
      { value: "deepseek-chat",      label: "DeepSeek-V3 (推荐)" },
      { value: "deepseek-reasoner",  label: "DeepSeek-R1 (推理增强)" },
    ],
    notice: `<strong>DeepSeek 使用指引：</strong><br>
      1. 前往 <a href="https://platform.deepseek.com/api_keys" target="_blank" rel="noopener">platform.deepseek.com/api_keys</a> 创建 API Key。<br>
      2. DeepSeek API 与 OpenAI 接口格式完全兼容，价格更低。<br>
      3. 推荐模型：<strong>DeepSeek-V3</strong>（创意生成效果好）；<strong>DeepSeek-R1</strong> 具备链式推理能力（响应较慢）。`,
  },
};

/* ═══════════════════════════════════════════════════════════
   DOM helpers
   ═══════════════════════════════════════════════════════════ */
const $  = (id) => document.getElementById(id);
const providerSel  = $("provider");
const modelSel     = $("model");
const apiKeyInput  = $("api-key");
const toggleKeyBtn = $("toggle-key-btn");
const generateBtn  = $("generate-btn");
const spinner      = $("spinner");
const spinnerText  = $("spinner-text");
const errorBox     = $("error-box");
const resultsSection = $("results-section");
const namesContainer = $("names-container");
const rawOutput    = $("raw-output");
const rawToggle    = $("raw-toggle");
const copyAllBtn   = $("copy-all-btn");
const providerNotice = $("provider-notice");

/* ── Populate models & notice when provider changes ── */
function updateProviderUI() {
  const cfg = PROVIDERS[providerSel.value];
  modelSel.innerHTML = cfg.models
    .map(m => `<option value="${m.value}">${m.label}</option>`)
    .join("");
  providerNotice.innerHTML = cfg.notice;
}
providerSel.addEventListener("change", updateProviderUI);
updateProviderUI(); // init

/* ── Toggle API key visibility ── */
toggleKeyBtn.addEventListener("click", () => {
  if (apiKeyInput.type === "password") {
    apiKeyInput.type = "text";
    toggleKeyBtn.textContent = "隐藏";
  } else {
    apiKeyInput.type = "password";
    toggleKeyBtn.textContent = "显示";
  }
});

/* ── Raw output toggle ── */
rawToggle.addEventListener("click", () => {
  const shown = rawOutput.style.display === "block";
  rawOutput.style.display = shown ? "none" : "block";
  rawToggle.textContent = shown ? "▶ 查看 AI 原始回复" : "▼ 收起 AI 原始回复";
});

/* ═══════════════════════════════════════════════════════════
   Compliance checker
   ═══════════════════════════════════════════════════════════ */
const PROMO_WORDS    = /\b(best|top|new|free|sale|noads)\b/i;
const INDUCING_WORDS = /\b(hot|fire|download|update)\b/i;
const GAMBLING_WORDS = /\b(win\s*money|cash|bet)\b/i;
const IP_WORDS       = /\b(disney|marvel|nintendo|pokemon|pokémon|minecraft|roblox|fortnite)\b/i;

function runChecklist(name) {
  const len       = name.length;
  const allCaps   = name === name.toUpperCase() && /[A-Z]/.test(name);
  const hasEmoji  = /[\u{1F300}-\u{1FFFF}]|[\u{2600}-\u{27BF}]/u.test(name);
  const hasPunct  = /[!?]{2,}|[*]{2,}/.test(name);
  const hasDash   = /-/.test(name);

  const checks = [
    { key: "len30",    label: "≤30字符",    pass: len <= 30,              warn: false },
    { key: "len20",    label: "≤20字符(建议)", pass: len <= 20,            warn: true  },
    { key: "noAllCap", label: "无全大写",    pass: !allCaps,               warn: false },
    { key: "noEmoji",  label: "无Emoji",    pass: !hasEmoji,              warn: false },
    { key: "noPunct",  label: "无连续标点",  pass: !hasPunct,             warn: false },
    { key: "noDash",   label: "无短破折号",  pass: !hasDash,              warn: true  },
    { key: "noPromo",  label: "无促销词",    pass: !PROMO_WORDS.test(name),  warn: false },
    { key: "noInduce", label: "无诱导词",    pass: !INDUCING_WORDS.test(name), warn: false },
    { key: "noGamble", label: "无博彩高风险词", pass: !GAMBLING_WORDS.test(name), warn: false },
    { key: "noIP",     label: "无IP侵权风险", pass: !IP_WORDS.test(name), warn: false },
  ];

  // Critical checks (must pass)
  const critical = ["len30","noAllCap","noEmoji","noPunct","noPromo","noInduce","noGamble","noIP"];
  const failedCritical = checks.filter(c => critical.includes(c.key) && !c.pass);
  const failedWarn     = checks.filter(c => c.warn && !c.pass);

  let verdict, verdictLabel;
  if (failedCritical.length > 0) {
    verdict = "reject"; verdictLabel = "❌ 不可用（关键项不通过）";
  } else if (failedWarn.length > 0) {
    verdict = "review"; verdictLabel = "⚠️ 初步可用（建议人工核验）";
  } else {
    verdict = "ok";     verdictLabel = "✅ 初步通过（仍需人工查重 & 商标检索）";
  }

  return { len, checks, verdict, verdictLabel };
}

/* ═══════════════════════════════════════════════════════════
   Parse AI output
   Format expected: numbered list with name and description
   ═══════════════════════════════════════════════════════════ */
function parseNames(text) {
  const results = [];
  // Match lines like: 1. **Name Here** - description  OR  1. Name Here - description
  // The regex and length filter are intentionally generous (up to ~51 chars) so that
  // ALL AI-generated names are captured; the compliance checker then flags any that
  // exceed 30 characters or violate other rules, giving the user clear feedback.
  const lines = text.split("\n");
  const re = /^\s*\d+[\.\)]\s+\**([A-Za-z][A-Za-z0-9 '\-:&]{1,50})\**\s*[-–—:]?\s*(.*)/;

  for (const line of lines) {
    const m = line.match(re);
    if (m) {
      const name = m[1].trim().replace(/\*+/g, "").trim();
      const desc = m[2].trim().replace(/\*+/g, "").trim();
      if (name.length >= 3 && name.length <= 60) {
        results.push({ name, desc });
      }
    }
  }
  return results;
}

/* ═══════════════════════════════════════════════════════════
   Render result cards
   ═══════════════════════════════════════════════════════════ */
function renderResults(names) {
  namesContainer.innerHTML = "";
  if (!names.length) {
    namesContainer.innerHTML = `<p style="color:#888;font-size:.88rem;">未能解析出名称列表，请查看原始回复。</p>`;
    return;
  }

  names.forEach(({ name, desc }) => {
    const { len, checks, verdict, verdictLabel } = runChecklist(name);
    const badgeClass = len > 30 ? "over" : "";

    const checkHTML = checks.map(c => {
      const cls = c.pass ? "pass" : (c.warn ? "warn" : "fail");
      const icon = c.pass ? "✓" : "✗";
      return `<span class="check-item ${cls}">${icon} ${c.label}</span>`;
    }).join("");

    const card = document.createElement("div");
    card.className = "name-card";
    card.innerHTML = `
      <div class="name-card-header">
        <span class="name-title">${escapeHtml(name)}</span>
        <span class="name-char-badge ${badgeClass}">${len} 字符</span>
      </div>
      ${desc ? `<div class="name-desc">${escapeHtml(desc)}</div>` : ""}
      <div class="checklist">${checkHTML}</div>
      <div class="verdict ${verdict}">${verdictLabel}</div>
    `;
    namesContainer.appendChild(card);
  });
}

function escapeHtml(str) {
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* ═══════════════════════════════════════════════════════════
   Copy all names
   ═══════════════════════════════════════════════════════════ */
let _lastNames = [];
copyAllBtn.addEventListener("click", () => {
  if (!_lastNames.length) return;
  const text = _lastNames.map((n, i) => `${i+1}. ${n.name} (${n.name.length}字符) - ${n.desc}`).join("\n");
  navigator.clipboard.writeText(text).then(() => {
    copyAllBtn.textContent = "✅ 已复制";
    setTimeout(() => { copyAllBtn.textContent = "📋 复制全部名称"; }, 2000);
  }).catch(() => {
    prompt("请手动复制：", text);
  });
});

/* ═══════════════════════════════════════════════════════════
   Build the compliance prompt (fixed)
   ═══════════════════════════════════════════════════════════ */
function buildPrompt(gameplay, theme, style) {
  return `角色设定： 你是一位精通 Google Play ASO（应用商店优化）和合规政策的资深游戏运营专家。

任务： 请为我的一款即将上架 Google Play 的游戏构思 10 个英文名称。

游戏背景：
- 核心玩法： ${gameplay}
- 视觉题材： ${theme}
- 风格/情感： ${style || "不限"}

⚠️ 绝对限制条件（必须遵守）：
1. 长度限制： 包含空格必须严格控制在 30 个字符（字母）以内。
2. 违禁词屏蔽： 严禁出现 "Best", "Top", "New", "Free", "Sale", "NoAds", "Win Money", "Cash", "Bet" 等促销或高风险博彩词汇。
3. 诱导词屏蔽： 严禁出现 "Hot", "Fire", "Download", "Update" 等诱导性词汇。
4. 格式规范： 首字母大写即可，严禁全大写，严禁使用Emoji或连续标点（如!!，??）。
5. 无版权风险： 不要使用知名IP（如 Disney, Marvel）或受保护的名词。

输出格式（请严格遵守）：
请列出 10 个名字，每个格式如下：
序号. 名字 - 含义说明（含字符数统计，如：20字符）

示例格式：

请按此格式输出，不要输出其他内容。`;
}

/* ═══════════════════════════════════════════════════════════
   Error message localisation
   ═══════════════════════════════════════════════════════════ */
function localizeError(providerKey, status, body) {
  const providerName = PROVIDERS[providerKey].label;
  const bodyStr = typeof body === "string" ? body : JSON.stringify(body);

  if (status === 401) return `🔑 API Key 无效或已过期。请检查你的 ${providerName} API Key 是否正确，并确保具有调用权限。`;
  if (status === 402 || (bodyStr.includes("insufficient") && bodyStr.includes("balance")))
    return `💳 账户余额不足。请前往 ${providerName} 平台充值后重试。`;
  if (status === 429) return `⏳ 请求频率超限（Rate Limit）。请稍等片刻后重试。`;
  if (status === 403) return `🚫 访问被拒绝（403）。请确认 API Key 权限设置，或检查账户是否正常。`;
  if (status === 404) return `❓ 模型不存在或接口地址有误（404）。请检查所选模型是否在你的账户中可用。`;
  if (status >= 500)  return `🔧 ${providerName} 服务端错误（${status}）。请稍后重试。`;
  if (status === 0 || bodyStr.includes("Failed to fetch") || bodyStr.includes("NetworkError"))
    return `🌐 网络请求失败。可能原因：①浏览器安全限制（CORS）；②网络不通；③API 地址不可访问。建议使用现代浏览器并检查网络连接。`;

  return `⚠️ 请求出错（${status}）：${bodyStr.substring(0, 200)}`;
}

/* ═══════════════════════════════════════════════════════════
   Main generate function
   ═══════════════════════════════════════════════════════════ */
generateBtn.addEventListener("click", async () => {
  // Reset UI
  errorBox.classList.remove("visible");
  errorBox.textContent = "";
  resultsSection.classList.remove("visible");
  namesContainer.innerHTML = "";
  rawOutput.style.display = "none";
  rawOutput.textContent = "";
  rawToggle.textContent = "▶ 查看 AI 原始回复";

  // Validate inputs
  const providerKey = providerSel.value;
  const model       = modelSel.value;
  const apiKey      = apiKeyInput.value.trim();
  const gameplay    = $("gameplay").value.trim();
  const theme       = $("theme").value.trim();
  const style       = $("style").value.trim();

  const missing = [];
  if (!apiKey)    missing.push("API Key");
  if (!gameplay)  missing.push("品类词");
  if (!theme)     missing.push("题材词");
  if (missing.length) {
    errorBox.innerHTML = `❗ 请填写以下必填项：<strong>${missing.join("、")}</strong>`;
    errorBox.classList.add("visible");
    return;
  }

  // Show spinner
  generateBtn.disabled = true;
  spinner.classList.add("visible");
  spinnerText.textContent = `正在调用 ${PROVIDERS[providerKey].label} · ${model}，请稍候…`;

  try {
    const cfg    = PROVIDERS[providerKey];
    const prompt = buildPrompt(gameplay, theme, style);

    const payload = {
      model,
      messages: [{ role: "user", content: prompt }],
      temperature: 0.9,
      max_tokens: 1200,
    };

    const resp = await fetch(cfg.endpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": cfg.authHeader(apiKey),
      },
      body: JSON.stringify(payload),
    });

    const data = await resp.json().catch(() => ({}));

    if (!resp.ok) {
      const msg = localizeError(providerKey, resp.status, data?.error?.message || JSON.stringify(data));
      errorBox.innerHTML = msg;
      errorBox.classList.add("visible");
      return;
    }

    const text = data?.choices?.[0]?.message?.content || "";
    if (!text) {
      errorBox.innerHTML = "⚠️ AI 返回了空内容，请重试或更换模型。";
      errorBox.classList.add("visible");
      return;
    }

    rawOutput.textContent = text;

    const names = parseNames(text);
    _lastNames = names;

    resultsSection.classList.add("visible");
    renderResults(names);

  } catch (err) {
    const msg = localizeError(providerKey, 0, err.message || String(err));
    errorBox.innerHTML = msg;
    errorBox.classList.add("visible");
  } finally {
    generateBtn.disabled = false;
    spinner.classList.remove("visible");
  }
});
</script>
